<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="menuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>
    <radialGradient id="menuCyan" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#menuGrad)" />
  <circle cx="600" cy="400" r="420" fill="url(#menuCyan)" />

  <!-- Center Luxury Smartphone Device -->
  <g transform="translate(425, 45)">
    <!-- Device border & shadow -->
    <rect width="350" height="710" rx="42" fill="#0d1118" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
    <rect x="10" y="10" width="330" height="690" rx="34" fill="#06090e" />

    <!-- Speaker / Island -->
    <rect x="120" y="22" width="110" height="22" rx="11" fill="#000000" />

    <!-- In-App Header -->
    <g transform="translate(32, 64)">
      <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Le Bistrô &amp; Café</text>
      <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#00e5ff">Aberto para pedidos</text>

      <!-- Category Filter Pills -->
      <g transform="translate(0, 42)">
        <rect width="84" height="28" rx="14" fill="#0066ff" />
        <text x="14" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Destaques</text>

        <rect x="94" width="84" height="28" rx="14" fill="#121824" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="110" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8898ac">Pratos</text>

        <rect x="188" width="76" height="28" rx="14" fill="#121824" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="202" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8898ac">Bebidas</text>
      </g>

      <!-- Menu Items -->
      <g transform="translate(0, 94)">
        <!-- Item 1 -->
        <g transform="translate(0, 0)">
          <rect width="266" height="96" rx="12" fill="#0e131d" stroke="#ffffff" stroke-opacity="0.08" />
          <rect x="14" y="14" width="68" height="68" rx="8" fill="#1b2536" />
          <text x="94" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Risoto Trufado</text>
          <text x="94" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#7d8ea3">Arroz arbóreo e cogumelos</text>
          <text x="94" y="74" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#00e5ff">R$ 68,00</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(0, 110)">
          <rect width="266" height="96" rx="12" fill="#0e131d" stroke="#ffffff" stroke-opacity="0.08" />
          <rect x="14" y="14" width="68" height="68" rx="8" fill="#182230" />
          <text x="94" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Salmão Grelhado</text>
          <text x="94" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#7d8ea3">Legumes no vapor e ervas</text>
          <text x="94" y="74" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#00e5ff">R$ 74,00</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(0, 220)">
          <rect width="266" height="96" rx="12" fill="#0e131d" stroke="#ffffff" stroke-opacity="0.08" />
          <rect x="14" y="14" width="68" height="68" rx="8" fill="#151e2b" />
          <text x="94" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Soda Italiana</text>
          <text x="94" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#7d8ea3">Frutas vermelhas e hortelã</text>
          <text x="94" y="74" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#00e5ff">R$ 18,00</text>
        </g>
      </g>

      <!-- Cart Button Sticky Bottom -->
      <g transform="translate(0, 480)">
        <rect width="266" height="50" rx="25" fill="#0066ff" />
        <text x="76" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Conferir Pedido (1)</text>
      </g>
